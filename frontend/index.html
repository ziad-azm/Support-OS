<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Anti-FOUC: set dir/lang before first paint. The bundle re-applies this
      // authoritatively at boot; this only avoids a visible LTR->RTL flip.
      // Key must match LANGUAGE_STORAGE_KEY in src/shared/i18n/config.ts.
      // i18next-browser-languagedetector stores a bare string (verified in
      // its source: `localStorage.setItem(lookupLocalStorage, lng)`) — no
      // JSON.parse needed here.
      try {
        if (window.localStorage.getItem('supportos.language') === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
        // Same idea, for theme: set .dark before first paint. The bundle
        // re-applies this authoritatively at boot (shared/theme/theme.ts).
        // Key must match THEME_STORAGE_KEY in src/shared/theme/config.ts.
        var theme = window.localStorage.getItem('supportos.theme')
        if (
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
        // Same idea again, for branding: paint the brand colour before
        // first paint. The bundle re-applies this authoritatively at boot
        // (src/shared/branding/branding.ts). Key must match
        // BRANDING_STORAGE_KEY in src/shared/branding/config.ts.
        //
        // UNLIKE the two keys above, this one holds JSON, not a bare
        // string — hence JSON.parse. The values are already RESOLVED
        // (the module computed the foreground and validated the hex before
        // caching), so there is no colour maths here and no second copy of
        // contrast.ts to drift.
        var brand = JSON.parse(window.localStorage.getItem('supportos.branding') || 'null')
        if (brand && typeof brand.primary === 'string' && brand.primary) {
          document.documentElement.style.setProperty('--primary', brand.primary)
          document.documentElement.style.setProperty(
            '--primary-foreground',
            brand.primaryForeground,
          )
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
