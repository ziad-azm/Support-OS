<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportOS</title>
    <script>
      // Anti-FOUC: set dir/lang before first paint. The bundle re-applies this
      // authoritatively at boot; this only avoids a visible LTR->RTL flip.
      // Key must match LANGUAGE_STORAGE_KEY in src/shared/i18n/config.ts.
      // i18next-browser-languagedetector stores a bare string (verified in
      // its source: `localStorage.setItem(lookupLocalStorage, lng)`) — no
      // JSON.parse needed here.
      try {
        if (window.localStorage.getItem('supportos.language') === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
